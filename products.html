<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="./style3.css">
</head>
<body>
    <!-- Header section with title -->
    <header class="site-header">
        <h1>Featured Products</h1>
        <p class="subtitle">Handpicked items just for you</p>
    </header>

    <!-- Main section containing 6 product cards -->
    <main class="products-container">
        <!-- Card 1 -->
        <article class="product-card">
            <img src="https://i.ibb.co/ZvsRczW/61o-Ubs-Hu-Wu-L-AC-SY741.jpg" alt="Wireless Headphones">
            <h2 class="product-name">Wireless Headphones</h2>
            <p class="price">R89.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <!-- Card 2 -->
        <article class="product-card">
            <img src="https://i.ibb.co/KcMGtZKz/61s-XRcl-Smz-L-AC-SX522.jpg" alt="Smart Watch">
            <h2 class="product-name">Smart Watch</h2>
            <p class="price">R149.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <!-- Card 3 -->
        <article class="product-card">
            <img src="https://i.ibb.co/C5tPKyM9/dig-cam.jpg" alt="Digital Camera">
            <h2 class="product-name">Digital Camera</h2>
            <p class="price">R299.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <!-- Card 4 -->
        <article class="product-card">
            <img src="https://i.ibb.co/kVtDqs8S/bspeaker.jpg" alt="Bluetooth Speaker">
            <h2 class="product-name">Bluetooth Speaker</h2>
            <p class="price">R159.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <!-- Card 5 -->
        <article class="product-card">
            <img src="https://i.ibb.co/nsB10Dcb/mech-keyboard.jpg" alt="Mechanical Keyboard">
            <h2 class="product-name">Mechanical Keyboard</h2>
            <p class="price">R659.11</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <!-- Card 6 -->
        <article class="product-card">
            <img src="https://i.ibb.co/Q753Z2JL/mouse.webp" alt="Gaming Mouse  ">
            <h2 class="product-name">Gaming Mouse</h2>
            <p class="price">R49.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>
    </main>
</body>
</html>
